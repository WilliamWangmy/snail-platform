# 本机开发：连本机已启动的 MySQL 与 Valkey；默认值只指 127.0.0.1，端口或口令不同就用 SNAIL_* 环境变量覆盖
spring:
  datasource:
    url: ${SNAIL_DB_URL:jdbc:mysql://127.0.0.1:3306/snail_platform}
    username: ${SNAIL_DB_USERNAME:snail}
    password: ${SNAIL_DB_PASSWORD:snail}
  data:
    redis:
      url: ${SNAIL_REDIS_URL:redis://127.0.0.1:6379}
  flyway:
    placeholders:
      # V1 种子写入 admin 口令所需:BCrypt 密文(非明文)。默认是 admin123 的密文,由首次登录强制改密兜底;
      # 可用 SNAIL_SEED_ADMIN_PASSWORD 环境变量覆盖。不生成随机口令、不打印到日志。
      "[seedAdminPassword]": ${SNAIL_SEED_ADMIN_PASSWORD:$2a$10$DIo9lf8l8xeeBQPAsgZW0uexouQqyZ0TMR0XT6Yi3/m4Mye81/Hcu}

logging:
  level:
    com.snail.platform: DEBUG

snail:
  auth:
    oauth:
      sources:
        # 本机两端 dev 回调白名单:admin :8000 / workflow :8002;mock 通道与真实厂商联调都走这里,生产域名另行登记
        dingtalk:
          redirect-uris: http://localhost:8000/oauth-callback/dingtalk,http://localhost:8002/oauth-callback/dingtalk
        feishu:
          redirect-uris: http://localhost:8000/oauth-callback/feishu,http://localhost:8002/oauth-callback/feishu
        wecom:
          redirect-uris: http://localhost:8000/oauth-callback/wecom,http://localhost:8002/oauth-callback/wecom
  security:
    jwt:
      # 开发占位密钥只住 dev profile;生产密钥必须由 SNAIL_JWT_SECRET 提供,共享配置无默认可漏
      secret: ${SNAIL_JWT_SECRET:snail-platform-dev-jwt-secret-change-me-0123456789}
  external:
    sms:
      # 开发态短信走 mock 通道:发送动作同走网关留痕(sys_external_call_log),手机号打码;
      # 码值默认不落日志,从 Valkey GET snail:auth:sms:{phone} 取;
      # 本机自测要直接看码可开 mock-echo-code,生产 profile 两个开关都不存在,天然关闭
      mock: ${SNAIL_SMS_MOCK:true}
      mock-echo-code: ${SNAIL_SMS_MOCK_ECHO_CODE:true}
    oauth:
      # 开发态厂商调用走 mock 通道:authorizeUrl 直接造成本地回调,不申请厂商应用即可端到端跑通;
      # 生产 profile 无此键,@ConditionalOnProperty 缺省走真实客户端
      mock: ${SNAIL_OAUTH_MOCK:true}
      # mock 身份的实名手机号:改成与本地库某用户 sys_user.phone 一致即可验证 JIT 绑定与多租户 pick
      mock-mobile: ${SNAIL_OAUTH_MOCK_MOBILE:13800000000}
  storage:
    sftp:
      # 本机 SFTP 的开发默认连接;生产必须由环境变量提供,共享配置不放开任何默认口令
      host: ${SNAIL_SFTP_HOST:127.0.0.1}
      username: ${SNAIL_SFTP_USERNAME:snail}
      password: ${SNAIL_SFTP_PASSWORD:snail}
      base-dir: ${SNAIL_SFTP_BASE_DIR:/data/snail/files}
      # 本机存储多为自签指纹;生产保持严格校验并按 known-hosts 带外分发
      strict-host-key-checking: ${SNAIL_SFTP_STRICT_HOST_KEY:false}
