spring:
  application:
    name: snail-platform
  profiles:
    active: ${SNAIL_PROFILE:dev}
  threads:
    virtual:
      # 运行时 JDK≥21 才生效，JDK 17 静默关闭；产物仍按 17 编译
      enabled: true
  servlet:
    multipart:
      # 与 snail.storage.upload.max-size-mb 对齐,单点口径别漂移
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    # 单库单目录，脚本就放在本模块 resources/db/migration 下
    locations: classpath:db/migration
  cache:
    type: caffeine
    # 缓存名单点声明，业务侧不各自建缓存
    cache-names: dictItem, menuTree, tenantConfig, orgSubtree, userPerms, userSession
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=10m

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

snail:
  security:
    jwt:
      # secret 不在共享配置给默认值:开发占位只住 dev profile,prod 缺 SNAIL_JWT_SECRET 启动即失败;短于 32 字符拒绝启动
      secret: ${SNAIL_JWT_SECRET}
      expire-minutes: 120
  db:
    tenant:
      # 租户过滤豁免清单：平台级表、纯关系表、只增日志表；口径详见 docs/system-business-design.md
      ignore-tables:
        - sys_tenant
        - sys_user_role
        - sys_login_log
        - sys_oper_log
        - sys_menu
        - sys_role_menu
        - sys_notify_outbound
    pagination:
      max-limit: 500
  storage:
    # type 缺省(空)= 不装配写入端口,文件功能端点按"文件存储未配置"降级;
    # 开关打开后所选后端必填,配置缺失即启动失败;开发默认连接只住 application-dev.yml
    type: ${SNAIL_STORAGE_TYPE:}
    sftp:
      host: ${SNAIL_SFTP_HOST:}
      port: ${SNAIL_SFTP_PORT:22}
      username: ${SNAIL_SFTP_USERNAME:}
      password: ${SNAIL_SFTP_PASSWORD:}
      private-key: ${SNAIL_SFTP_PRIVATE_KEY:}
      base-dir: ${SNAIL_SFTP_BASE_DIR:}
      # 严格指纹校验默认开启,known-hosts 必填;自签指纹的开发/测试环境显式关闭
      known-hosts: ${SNAIL_SFTP_KNOWN_HOSTS:}
      strict-host-key-checking: ${SNAIL_SFTP_STRICT_HOST_KEY:true}
      connect-timeout-ms: ${SNAIL_SFTP_CONNECT_TIMEOUT_MS:10000}
      session-timeout-ms: ${SNAIL_SFTP_SESSION_TIMEOUT_MS:30000}
    s3:
      # 协议兼容端点与凭证不给开发默认值;type=s3 而这些值缺失,装配校验启动即失败
      endpoint: ${SNAIL_S3_ENDPOINT:}
      region: ${SNAIL_S3_REGION:us-east-1}
      bucket: ${SNAIL_S3_BUCKET:}
      access-key: ${SNAIL_S3_AK:}
      secret-key: ${SNAIL_S3_SK:}
      # true 路径式 endpoint/bucket/key(MinIO 等自建必需);false 虚拟主机 bucket.endpoint/key(阿里 OSS/腾讯 COS 兼容端点用这个)
      path-style: true
    upload:
      max-size-mb: 50
      ext-whitelist: jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,md,zip,7z
