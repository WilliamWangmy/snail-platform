# 应用骨架:应用名/profile/运行时行为/迁移脚本位置/文档端点 + 模块配置导入清单。
# 功能配置按 snail-platform-function 模块拆分在 config/ 目录,经 spring.config.import 导入
# (imported 文件优先级高于 application.yml,而 application-{profile}.yml 又高于 imported 文件
# ——即环境差异的 IP/端口/口令等一律住 dev/prod,模块文件只放与环境无关的结构与开关):
#   auth.yml      安全/JWT/CORS + 登录鉴权(snail-framework-security、snail-function-auth)
#   external.yml  三方凭据/短信通道/邮件(snail-function-external)
#   notify.yml    消息触达(snail-function-notify)
#   storage.yml   文件存储(snail-function-storage)
#   workflow.yml  流程引擎(snail-function-workflow)
# 凭据一律环境变量注入,共享配置不留真实默认值。
spring:
  application:
    name: snail-platform
  profiles:
    active: ${SNAIL_PROFILE:dev}
  threads:
    virtual:
      # 运行时 JDK≥21 才生效，JDK 17 静默关闭；产物仍按 17 编译
      enabled: true
  servlet:
    multipart:
      # 与 snail.storage.upload.max-size-mb 对齐,单点口径别漂移
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    # 单库，脚本集中在本模块 resources/db/migration，按 function 模块分子目录；Flyway 递归扫描，版本号全局递增
    locations: classpath:db/migration
  config:
    import:
      - optional:classpath:config/auth.yml
      - optional:classpath:config/external.yml
      - optional:classpath:config/notify.yml
      - optional:classpath:config/storage.yml
      - optional:classpath:config/workflow.yml
  # 缓存规格不再走统一 spec:userSession 是会话态需要 expireAfterAccess+大容量,
  # 配置类缓存只需小容量——分规格声明迁至 com.snail.platform.config.CacheSpecConfig,
  # 新增缓存名必须去那里登记,业务侧不各自建缓存

# 文档端点默认开放;prod profile 整体关闭(application-prod.yml)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
