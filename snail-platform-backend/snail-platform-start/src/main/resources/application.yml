spring:
  application:
    name: snail-platform
  profiles:
    active: ${SNAIL_PROFILE:dev}
  threads:
    virtual:
      # 运行时 JDK≥21 才生效，JDK 17 静默关闭；产物仍按 17 编译
      enabled: true
  servlet:
    multipart:
      # 与 snail.storage.upload.max-size-mb 对齐,单点口径别漂移
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    # 单库单目录，脚本就放在本模块 resources/db/migration 下
    locations: classpath:db/migration
  # 缓存规格不再走统一 spec:userSession 是会话态需要 expireAfterAccess+大容量,
  # 配置类缓存只需小容量——分规格声明迁至 com.snail.platform.config.CacheSpecConfig,
  # 新增缓存名必须去那里登记,业务侧不各自建缓存

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

flowable:
  # 建表归 Flyway(V4)，引擎不得自动建表/自动升级
  database-schema-update: false
  # 不从 classpath 自动部署流程定义，发布只走业务发布链路
  check-process-definitions: false
  # 定时器与异步作业需要执行器；异步历史关闭，避免多一条后台写链路
  async-executor-activate: true
  async-history-executor-activate: false
  # AUDIT 不记变量明细，控制 ACT_HI_DETAIL 膨胀
  history-level: audit
  # 平台自有用户体系，不启用 Flowable IDM/JPA
  jpa-enabled: false
  idm:
    enabled: false
  process:
    # 禁用 DTD/外部实体；BPMN 发布前还有业务侧白名单校验
    enable-safe-xml: true
    definition-cache-limit: 128

snail:
  security:
    jwt:
      # secret 不在共享配置给默认值:开发占位只住 dev profile,prod 缺 SNAIL_JWT_SECRET 启动即失败;短于 32 字符拒绝启动
      secret: ${SNAIL_JWT_SECRET}
      expire-minutes: 120
    cors:
      # 令牌走 Authorization 头,跨域只按名白名单放开且不带凭证;留空即不下发 CORS 头(同源部署、开发期代理都无需配置)
      allowed-origins: ${SNAIL_CORS_ALLOWED_ORIGINS:}
  db:
    tenant:
      # 租户过滤豁免清单：平台级表、纯关系表、只增日志表；口径详见 docs/system-business-design.md
      ignore-tables:
        - sys_tenant
        - sys_user_role
        - sys_login_log
        - sys_oper_log
        - sys_menu
        - sys_role_menu
        - sys_notify_outbound
        # 第三方调用流水:落账在异步线程,租户/操作人靠行内快照列
        - sys_external_call_log
        # 流程模板与菜单同口径:平台维护一份全局目录,租户只读来建模型,本身不带租户列
        - sys_workflow_template
        # 第三方身份绑定:登录按(source,open_id)跨租户定位,tenant_id 只是绑定时刻的展示快照
        - sys_user_identity
  pagination:
    max-limit: 500
  auth:
    oauth:
      # 第三方扫码登录(钉钉/飞书/企业微信)总开关:回滚第一级,false 时入口列表返回空、端点按"登录方式未开放"拒绝
      enabled: ${SNAIL_AUTH_OAUTH_ENABLED:true}
      phone-bind:
        # 未绑定身份按厂商实名手机号自动关联唯一可用平台账号并落绑定;false 则一律走报错引导
        enabled: ${SNAIL_AUTH_OAUTH_PHONE_BIND:true}
      sources:
        # 各来源授权回调地址白名单(逗号分隔,精确匹配);凭证(snail.external.oauth.*)缺失的来源天然不可用
        dingtalk:
          redirect-uris: ${SNAIL_OAUTH_DINGTALK_REDIRECT_URIS:}
        feishu:
          redirect-uris: ${SNAIL_OAUTH_FEISHU_REDIRECT_URIS:}
        wecom:
          redirect-uris: ${SNAIL_OAUTH_WECOM_REDIRECT_URIS:}
  notify:
    push:
      # 站内消息实时推送(SSE)总开关:关闭即退化为 30s 轮询,订阅端点按"未开启"拒绝
      enabled: ${SNAIL_NOTIFY_PUSH_ENABLED:true}
    sms:
      templates:
        # 流程待办通用短信模板编码:阿里云报备后回填(O1);缺省空 = 短信通道不可用,投递器跳过
        todo: ${SNAIL_NOTIFY_SMS_TODO_TEMPLATE:}
  external:
    oauth:
      # 厂商应用凭据一律环境变量注入;缺凭据的来源 available()=false 即不可用,不阻断启动,共享配置不留真实默认值
      dingtalk:
        app-id: ${SNAIL_DINGTALK_APP_ID:}
        app-secret: ${SNAIL_DINGTALK_APP_SECRET:}
      feishu:
        app-id: ${SNAIL_FEISHU_APP_ID:}
        app-secret: ${SNAIL_FEISHU_APP_SECRET:}
      wecom:
        corp-id: ${SNAIL_WECOM_CORP_ID:}
        agent-id: ${SNAIL_WECOM_AGENT_ID:}
        corp-secret: ${SNAIL_WECOM_CORP_SECRET:}
  storage:
    # type 缺省(空)= 不装配写入端口,文件功能端点按"文件存储未配置"降级;
    # 开关打开后所选后端必填,配置缺失即启动失败;开发默认连接只住 application-dev.yml
    type: ${SNAIL_STORAGE_TYPE:}
    sftp:
      host: ${SNAIL_SFTP_HOST:}
      port: ${SNAIL_SFTP_PORT:22}
      username: ${SNAIL_SFTP_USERNAME:}
      password: ${SNAIL_SFTP_PASSWORD:}
      private-key: ${SNAIL_SFTP_PRIVATE_KEY:}
      base-dir: ${SNAIL_SFTP_BASE_DIR:}
      # 严格指纹校验默认开启,known-hosts 必填;自签指纹的开发/测试环境显式关闭
      known-hosts: ${SNAIL_SFTP_KNOWN_HOSTS:}
      strict-host-key-checking: ${SNAIL_SFTP_STRICT_HOST_KEY:true}
      connect-timeout-ms: ${SNAIL_SFTP_CONNECT_TIMEOUT_MS:10000}
      session-timeout-ms: ${SNAIL_SFTP_SESSION_TIMEOUT_MS:30000}
    s3:
      # 协议兼容端点与凭证不给开发默认值;type=s3 而这些值缺失,装配校验启动即失败
      endpoint: ${SNAIL_S3_ENDPOINT:}
      region: ${SNAIL_S3_REGION:us-east-1}
      bucket: ${SNAIL_S3_BUCKET:}
      access-key: ${SNAIL_S3_AK:}
      secret-key: ${SNAIL_S3_SK:}
      # true 路径式 endpoint/bucket/key(MinIO 等自建必需);false 虚拟主机 bucket.endpoint/key(阿里 OSS/腾讯 COS 兼容端点用这个)
      path-style: true
    upload:
      max-size-mb: 50
      ext-whitelist: jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,md,zip,7z
