# 系统监控配置（snail-function-monitor）：结构与开关住本文件，凭据一律环境变量注入。
# 默认值即代码默认值（MonitorProperties），本文件只做显式化，运维改值不用翻代码。
# 监控端仅平台管理员使用（OQ-19 B′），登录闸在后端 scene=monitor；本文件不含租户开关。
snail:
  monitor:
    # 总闸:false 时 /monitor/** 全部 400「监控功能未开放」,采样/评估/清理调度空转(DD-01,Bean 图恒定)
    enabled: true
    # 采样 tick 间隔(秒),同时驱动评估与数据源状态刷新
    sample-interval-seconds: 60
    metrics:
      # builtin=进程内置采集;prometheus=外部源,未映射/失败键回退内置(DD-06)
      # 已切 prometheus:等后端重启、Prometheus Targets 页 snail-platform 转 UP 即全链路生效
      source: prometheus
      prometheus:
        base-url: ${SNAIL_MONITOR_PROM_URL:http://localhost:9090}
        username: ${SNAIL_MONITOR_PROM_USER:}
        password: ${SNAIL_MONITOR_PROM_PASSWORD:}
        timeout-ms: 3000
        # 单 tick 外部查询总预算(DD-06)
        total-timeout-ms: 5000
        # MetricKey → PromQL 映射;未映射键回退 builtin。聚合口径(sum/avg/max 跨实例),
        # 平台总览/曲线/告警 UI 零改动;exporter 指标名以部署版本为准,不匹配的键删行即回退
        queries:
          # ── system(node_exporter) ──
          system.cpu.usage: 'avg(rate(node_cpu_seconds_total{mode!="idle"}[1m]))*100'
          process.cpu.usage: 'avg(process_cpu_usage)*100'
          disk.usage.percent: '100*(1-avg(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"})/avg(node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}))'
          # ── jvm(Micrometer,多实例聚合;实例拆分见方案批次 D) ──
          jvm.heap.used.percent: 'sum(jvm_memory_used_bytes{area="heap"})/sum(jvm_memory_max_bytes{area="heap"})*100'
          jvm.heap.used.mb: 'sum(jvm_memory_used_bytes{area="heap"})/1048576'
          jvm.nonheap.used.mb: 'sum(jvm_memory_used_bytes{area="nonheap"})/1048576'
          jvm.threads.live: 'sum(jvm_threads_live_threads)'
          jvm.gc.pause.ms: 'sum(rate(jvm_gc_pause_seconds_sum[1m]))*1000'
          # ── http ──
          http.server.qps: 'sum(rate(http_server_requests_seconds_count[1m]))'
          http.server.rt.avg.ms: 'sum(rate(http_server_requests_seconds_sum[1m]))/sum(rate(http_server_requests_seconds_count[1m]))*1000'
          http.server.error.rate: 'sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m]))/sum(rate(http_server_requests_seconds_count[1m]))*100'
          # ── db 池(HikariCP) ──
          db.pool.active: 'sum(hikaricp_connections_active)'
          db.pool.idle: 'sum(hikaricp_connections_idle)'
          db.pool.pending: 'sum(hikaricp_connections_pending)'
          db.pool.usage.percent: 'sum(hikaricp_connections_active)/(sum(hikaricp_connections_active)+sum(hikaricp_connections_idle))*100'
          # ── MySQL(mysqld_exporter) ──
          db.sql.qps: 'sum(rate(mysql_global_status_queries[1m]))'
          db.sql.slow.5m: 'sum(increase(mysql_global_status_slow_queries[5m]))'
          db.mysql.threads.connected: 'max(mysql_global_status_threads_connected)'
          db.mysql.threads.running: 'max(mysql_global_status_threads_running)'
          db.mysql.row.lock.waits: 'sum(rate(mysql_global_status_innodb_row_lock_waits[1m]))*60'
          # ── up 探针 ──
          db.up: 'max(up{job="mysql"})'
          valkey.up: 'max(up{job="valkey"})'
          # 不映射:online.users / login.fail.5m 业务内存键,Prometheus 无对应,
          # DD-06 未映射回退 builtin 自动补齐
    logs:
      # file=本地日志文件检索;loki=外部日志源(不可达报错,不静默回退 file)
      source: file
      file:
        dir: logs
        active-name: snail-platform.log
      scan-max-lines: 2000000
      scan-timeout-ms: 3000
      # tail 只读活跃文件末尾字节数(DD-26)
      tail-max-bytes: 2097152
      loki:
        base-url: ${SNAIL_MONITOR_LOKI_URL:}
        timeout-ms: 5000
        selector: '{job="snail-platform"}'
    db:
      slow-sql:
        enabled: true                 # false = 摘除拦截器口径（停采集，回滚开关）
        threshold-ms: 1000            # ≥ 该值计入慢 SQL 与 db.sql.slow.5m
        max-digests: 500              # SQL 模板摘要上限，超出淘汰最久未命中
        recent-size: 100              # 最近慢 SQL 事件条数（内存，不落库）
        max-sql-length: 500           # 归一化后 SQL 截断长度
      server:
        enabled: true                 # SHOW GLOBAL STATUS / @@global.max_connections
        timeout-ms: 1000              # 失败置 server.available=false，不影响池与慢 SQL
    arthas:
      enabled: false                  # true 且 base-url 可达时，诊断页出现「Arthas 在线诊断」tab
      base-url: ${SNAIL_MONITOR_ARTHAS_URL:}       # tunnel web 地址，如 https://arthas-tunnel.internal
      ws-port: 7777                   # 浏览器直连 tunnel 的 agent WS 端口
      username: ${SNAIL_MONITOR_ARTHAS_USER:arthas}
      password: ${SNAIL_MONITOR_ARTHAS_PASSWORD:}  # actuator basic auth，仅服务端使用
      timeout-ms: 2000
      cache-seconds: 30
    links:
      grafana-url: ${SNAIL_MONITOR_GRAFANA_URL:}
    diag:
      agent-health-url: ${SNAIL_MONITOR_AGENT_HEALTH_URL:}
      item-timeout-ms: 2000
      total-timeout-ms: 10000
      rate-limit-seconds: 10
    cleanup:
      cron: '0 30 3 * * ?'
      metric-retention-days: 7
      alert-retention-days: 90
      report-retention-days: 30
      batch-size: 1000
      max-batches: 200

# actuator 暴露 health + prometheus(Prometheus 方案 §2.2):本模块声明 starter、start 传递获得(DD-02);
# /actuator/health 不进安全白名单,同样走 JWT;业务数据一律经 /monitor/**。
# /actuator/prometheus 是 Prometheus 服务端抓取入口,已在安全白名单放行(生产建议独立
# management.server.port + 内网安全组收敛暴露面,见 docs/方案_Prometheus监控接入.md §2.3)。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      access: read-only
  # 统一业务标签:Prometheus/Grafana 按 application 维度聚合
  metrics:
    tags:
      application: ${spring.application.name:snail-platform}
