# 文件存储:类型开关与后端连接结构(消费方:SnailStorageProperties)。
# 本机开发默认连接只住 application-dev.yml,生产一律环境变量注入,共享配置不留任何默认口令
snail:
  storage:
    # type 缺省(空)= 不装配写入端口,文件功能端点按"文件存储未配置"降级;
    # 开关打开后所选后端必填,配置缺失即启动失败
    type: ${SNAIL_STORAGE_TYPE:}
    sftp:
      host: ${SNAIL_SFTP_HOST:}
      port: ${SNAIL_SFTP_PORT:22}
      username: ${SNAIL_SFTP_USERNAME:}
      password: ${SNAIL_SFTP_PASSWORD:}
      private-key: ${SNAIL_SFTP_PRIVATE_KEY:}
      base-dir: ${SNAIL_SFTP_BASE_DIR:}
      # 严格指纹校验默认开启,known-hosts 必填;自签指纹的开发/测试环境在 application-dev.yml 显式关闭
      known-hosts: ${SNAIL_SFTP_KNOWN_HOSTS:}
      strict-host-key-checking: ${SNAIL_SFTP_STRICT_HOST_KEY:true}
      connect-timeout-ms: ${SNAIL_SFTP_CONNECT_TIMEOUT_MS:10000}
      session-timeout-ms: ${SNAIL_SFTP_SESSION_TIMEOUT_MS:30000}
    s3:
      # 协议兼容端点与凭证不给开发默认值;type=s3 而这些值缺失,装配校验启动即失败
      endpoint: ${SNAIL_S3_ENDPOINT:}
      region: ${SNAIL_S3_REGION:us-east-1}
      bucket: ${SNAIL_S3_BUCKET:}
      access-key: ${SNAIL_S3_AK:}
      secret-key: ${SNAIL_S3_SK:}
      # true 路径式 endpoint/bucket/key(MinIO 等自建必需);false 虚拟主机 bucket.endpoint/key(阿里 OSS/腾讯 COS 兼容端点用这个)
      path-style: true
    upload:
      max-size-mb: 50
      ext-whitelist: jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,md,zip,7z
