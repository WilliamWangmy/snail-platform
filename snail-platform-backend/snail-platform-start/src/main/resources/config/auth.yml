# 安全与登录鉴权域(snail-framework-security + snail-function-auth):
# JWT/CORS(snail.security)与登录开关/回调白名单(snail.auth)。
# JWT 密钥是环境差异项:开发占位住 application-dev.yml,prod 必填 SNAIL_JWT_SECRET。
# 开发态联调(mock 通道)只住 application-dev.yml,与此处无关。
snail:
  security:
    jwt:
      # secret 不在共享配置给默认值;短于 32 字符拒绝启动
      secret: ${SNAIL_JWT_SECRET}
      expire-minutes: 120
    cors:
      # 令牌走 Authorization 头,跨域只按名白名单放开且不带凭证;留空即不下发 CORS 头(同源部署、开发期代理都无需配置)
      allowed-origins: ${SNAIL_CORS_ALLOWED_ORIGINS:}
  auth:
    sms-login:
      # 短信登录总开关,灰度/回滚用;false 时短信三端点报"功能未开放"
      enabled: ${SNAIL_AUTH_SMS_LOGIN_ENABLED:true}
      # 登录验证码模板编码:阿里云报备后解开并回填;注释态为空 = 短信登录不可用,mock 通道忽略该值
      login-template-code: ${SNAIL_SMS_LOGIN_TEMPLATE:100001}
    oauth:
      # 第三方扫码登录(钉钉/飞书/企业微信)总开关:回滚第一级,false 时入口列表返回空、端点按"登录方式未开放"拒绝
      enabled: ${SNAIL_AUTH_OAUTH_ENABLED:true}
      phone-bind:
        # 未绑定身份按厂商实名手机号自动关联唯一可用平台账号并落绑定;false 则一律走报错引导
        enabled: ${SNAIL_AUTH_OAUTH_PHONE_BIND:true}
      sources:
        # 各来源授权回调地址白名单(逗号分隔,精确匹配)。缺省为开发态本机回调:
        # admin :8000 / workflow :8002,mock 通道与真实厂商本地联调都走这里;
        # 生产必须覆盖(application-prod.yml 已放 SNAIL_OAUTH_*_REDIRECT_URIS 占位,由环境变量登记真实域名),
        # 否则生产按 localhost 精确匹配,真实回调会被白名单拒绝
        dingtalk:
          redirect-uris: http://localhost:8000/oauth-callback/dingtalk,http://localhost:8002/oauth-callback/dingtalk
        feishu:
          redirect-uris: http://localhost:8000/oauth-callback/feishu,http://localhost:8002/oauth-callback/feishu
        wecom:
          redirect-uris: http://localhost:8000/oauth-callback/wecom,http://localhost:8002/oauth-callback/wecom
